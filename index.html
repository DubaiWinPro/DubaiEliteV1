<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DUBAI ELITE - VIP PLATFORM</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #020617; --bg-surface: #0b0f19; --bg-card: #0f172a; --bg-input: #1e293b;
            --primary-blue: #2563eb; --light-blue: #38bdf8; --shine-blue: #06b6d4;
            --blue-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
            --red: #ef4444; --green: #22c55e; --violet: #8b5cf6;
            --text-primary: #ffffff; --text-secondary: #94a3b8;
            --radius-lg: 16px; --radius-md: 12px;
            --glow: 0 0 25px rgba(6, 182, 212, 0.35);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Space Grotesk',sans-serif; outline:none; -webkit-tap-highlight-color:transparent; }
        body { background-color:var(--bg-main); color:var(--text-primary); overflow-x:hidden; display:flex; justify-content:center; min-height:100vh; }
        .phone-wrapper { width:100%; max-width:480px; background-color:var(--bg-surface); min-height:100vh; display:flex; flex-direction:column; position:relative; box-shadow:0 0 60px rgba(0,0,0,0.95); border-left:1px solid rgba(56,189,248,0.1); border-right:1px solid rgba(56,189,248,0.1); padding-bottom:74px; }
        .hidden { display:none !important; }
        .toast-notification { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-20px); background:#0f172a; border:2px solid var(--shine-blue); padding:14px 28px; border-radius:30px; z-index:99999; font-weight:800; opacity:0; transition:0.3s; pointer-events:none;}
        .toast-notification.active { transform:translateX(-50%) translateY(0); opacity:1; }
        .auth-container { padding:40px 24px; display:flex; flex-direction:column; justify-content:center; min-height:100vh; }
        .luxury-logo { text-align:center; margin-bottom:35px; }
        .luxury-logo h1 { font-weight:900; font-size:46px; letter-spacing:-1px; text-transform:uppercase; background:var(--blue-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .card-panel { background:var(--bg-card); border-radius:var(--radius-lg); padding:28px; border:1px solid rgba(56,189,248,0.08); }
        .form-group { margin-bottom:22px; }
        .form-group label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; color:var(--text-secondary); margin-bottom:8px; }
        .input-control { width:100%; background:var(--bg-input); border:1px solid rgba(255,255,255,0.08); padding:16px 18px; border-radius:var(--radius-md); color:#fff; font-size:15px; }
        .gold-button { width:100%; background:var(--blue-gradient); color:#fff; border:none; padding:18px; border-radius:var(--radius-md); font-size:16px; font-weight:900; text-transform:uppercase; cursor:pointer; }
        .app-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; background:var(--bg-card); border-bottom:1px solid rgba(56,189,248,0.12); position:sticky; top:0; z-index:1000; }
        .balance-chip { background:var(--bg-input); padding:10px 18px; border-radius:24px; border:2px solid var(--shine-blue); font-weight:900; display:flex; align-items:center; gap:8px; }
        .arena-padding { padding:20px 16px; }
        .period-card-panel { background:linear-gradient(145deg,#0f172a 0%,#0b0f19 100%); border-radius:var(--radius-lg); padding:22px; display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; border:1px solid rgba(56,189,248,0.1); }
        .countdown-value { font-size:36px; font-weight:900; color:var(--light-blue); font-family:monospace; }
        .color-matrix-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px; }
        .matrix-btn { border:none; padding:18px 0; border-radius:var(--radius-md); font-size:16px; font-weight:900; color:#fff; cursor:pointer; text-transform:uppercase; }
        .m-green { background:var(--green); } .m-violet { background:var(--violet); } .m-red { background:var(--red); }
        .fixed-navigation-shell { position:fixed; bottom:0; width:100%; max-width:480px; background:rgba(11,15,25,0.96); display:grid; grid-template-columns:repeat(3,1fr); padding:14px 0; border-top:1px solid rgba(56,189,248,0.15); z-index:9999; }
        .nav-anchor-item { display:flex; flex-direction:column; align-items:center; color:var(--text-secondary); cursor:pointer; font-size:12px; font-weight:700; gap:6px; }
        .nav-anchor-item.active { color:var(--light-blue); }
        .modal-blur-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:10000; display:flex; align-items:flex-end; }
        .modal-slide-sheet { width:100%; background:var(--bg-card); border-top-left-radius:24px; border-top-right-radius:24px; padding:28px 24px; border-top:2px solid var(--shine-blue); }
        .chip-flex-selection { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:22px; }
        .chip-node-selector { background:var(--bg-input); border:1px solid rgba(255,255,255,0.08); padding:14px 0; text-align:center; border-radius:var(--radius-md); cursor:pointer; font-weight:800; color:#fff; }
        .chip-node-selector.active { border-color:var(--light-blue); background:rgba(6,182,212,0.15); color:var(--light-blue); }
        .admin-view-container { padding:20px; background:#020617; min-height:100vh; }
        .live-bet-row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-weight:600; }
        .result-overlay { position:fixed; inset:0; z-index:50000; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); backdrop-filter:blur(6px); }
        .result-card { background:var(--bg-card); border-radius:24px; padding:36px; text-align:center; border:3px solid var(--shine-blue); width:90%; max-width:320px; animation:pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes pop-in { from{transform:scale(0.6);opacity:0;} to{transform:scale(1);opacity:1;} }
    </style>
</head>
<body>
<div class="phone-wrapper">
    <div id="system-toast" class="toast-notification">Notification</div>

    <!-- AUTH VIEW -->
    <div id="view-auth" class="auth-container">
        <div class="luxury-logo"><h1>DUBAI ELITE</h1><p>High Stakes Cash Arena</p></div>
        <div class="card-panel">
            <div class="form-group"><label>Mobile Number</label><input type="text" id="auth-input-account" class="input-control" placeholder="10-digit mobile"></div>
            <div class="form-group"><label>Password</label><input type="password" id="auth-input-secret" class="input-control" placeholder="Password"></div>
            <button class="gold-button" onclick="executeAuthenticationRequest()">Enter Arena</button>
        </div>
    </div>

    <!-- MAIN APP VIEW -->
    <div id="view-main-app-shell" class="hidden">
        <header class="app-header">
            <div style="font-weight:900; font-size:24px; color:var(--light-blue);">DUBAI ELITE</div>
            <div class="balance-chip"><i class="fa-solid fa-wallet"></i><span id="global-display-balance">₹0.00</span></div>
        </header>

        <!-- GAME -->
        <div id="view-game-arena" class="arena-padding">
            <div class="period-card-panel">
                <div><div style="font-size:12px; color:var(--text-secondary);">ROUND ID</div><div id="arena-period-id" style="font-size:22px; font-weight:800;">--------</div></div>
                <div style="text-align:right;"><div style="font-size:12px; color:var(--text-secondary);">TIME LEFT</div><div id="arena-timer-value" class="countdown-value">00:00</div></div>
            </div>
            <div class="color-matrix-grid">
                <button class="matrix-btn m-green" onclick="launchBetSheetModal('Green')">Green</button>
                <button class="matrix-btn m-violet" onclick="launchBetSheetModal('Violet')">Violet</button>
                <button class="matrix-btn m-red" onclick="launchBetSheetModal('Red')">Red</button>
            </div>
        </div>

        <!-- WALLET -->
        <div id="view-vault" class="arena-padding hidden">
            <div class="card-panel" style="text-align:center;">
                <p style="color:var(--text-secondary); margin-bottom:10px;">Your Balance</p>
                <h1 id="vault-balance" style="font-size:40px; font-weight:900;">₹0.00</h1>
                <button class="gold-button" style="margin-top:20px;" onclick="location.reload()">Refresh Session</button>
            </div>
        </div>

        <!-- ADMIN -->
        <div id="view-admin" class="admin-view-container hidden">
            <div class="card-panel">
                <h4 style="color:var(--light-blue); margin-bottom:15px;">ADMIN PANEL (SYNC ACTIVE)</h4>
                <div class="live-bet-row"><span>Green Pool:</span><strong id="adm-pool-green">₹0.00</strong></div>
                <div class="live-bet-row"><span>Violet Pool:</span><strong id="adm-pool-violet">₹0.00</strong></div>
                <div class="live-bet-row"><span>Red Pool:</span><strong id="adm-pool-red">₹0.00</strong></div>
                <div style="margin-top:20px;">
                    <label>Force Next Result:</label>
                    <div class="color-matrix-grid" style="margin-top:10px;">
                        <button class="matrix-btn m-green" onclick="forceAdminOutcome('Green')">Green</button>
                        <button class="matrix-btn m-violet" onclick="forceAdminOutcome('Violet')">Violet</button>
                        <button class="matrix-btn m-red" onclick="forceAdminOutcome('Red')">Red</button>
                    </div>
                </div>
            </div>
        </div>

        <nav class="fixed-navigation-shell">
            <div class="nav-anchor-item active" onclick="switchTab('game')"><i class="fa-solid fa-gamepad"></i><span>Arena</span></div>
            <div class="nav-anchor-item" onclick="switchTab('vault')"><i class="fa-solid fa-wallet"></i><span>Wallet</span></div>
            <div id="nav-item-admin" class="nav-anchor-item hidden" onclick="switchTab('admin')"><i class="fa-solid fa-sliders"></i><span>Admin</span></div>
        </nav>
    </div>
</div>

<!-- BET MODAL -->
<div id="bet-placement-modal-sheet" class="modal-blur-overlay hidden">
    <div class="modal-slide-sheet">
        <h3 id="bet-modal-title" style="margin-bottom:20px; font-weight:900;">Place Bet</h3>
        <div class="chip-flex-selection">
            <div class="chip-node-selector active" onclick="setChip(100, this)">₹100</div>
            <div class="chip-node-selector" onclick="setChip(500, this)">₹500</div>
            <div class="chip-node-selector" onclick="setChip(1000, this)">₹1000</div>
            <div class="chip-node-selector" onclick="setChip(5000, this)">₹5000</div>
        </div>
        <button class="gold-button" onclick="confirmBetPlacement()">Confirm Cash Placement</button>
        <button class="gold-button" style="background:none; color:var(--red); margin-top:10px;" onclick="closeModals()">Cancel</button>
    </div>
</div>

<script>
// ============================================================
// SUPABASE & STATE
// ============================================================
const { createClient } = supabase;
const _supabase = createClient('https://ofwpdybibavhajlqlcok.supabase.co', 'sb_publishable_sxqMDh1cMxndSc8Nefr8hA_PZI98wye');

const AppState = {
    user: null,
    isAdmin: false,
    period: 0,
    timer: 60,
    selectedColor: '',
    selectedAmt: 100,
    forcedOutcome: null,
    pool: { Green: 0, Violet: 0, Red: 0 },
    currentRoundBet: null
};

// ============================================================
// UI FUNCTIONS
// ============================================================
function displayToast(msg) {
    const t = document.getElementById('system-toast');
    t.innerText = msg; t.classList.add('active');
    setTimeout(() => t.classList.remove('active'), 2500);
}

function switchTab(t) {
    document.getElementById('view-game-arena').classList.add('hidden');
    document.getElementById('view-vault').classList.add('hidden');
    document.getElementById('view-admin').classList.add('hidden');
    const target = (t === 'game') ? 'view-game-arena' : 'view-' + t;
    document.getElementById(target).classList.remove('hidden');
    
    document.querySelectorAll('.nav-anchor-item').forEach(n => n.classList.remove('active'));
    event.currentTarget.classList.add('active');
}

function executeAuthenticationRequest() {
    const acc = document.getElementById('auth-input-account').value;
    const sec = document.getElementById('auth-input-secret').value;
    if(!acc || !sec) return displayToast("Enter details!");

    if(acc === "CR7" && sec === "CR7") {
        AppState.isAdmin = true;
        AppState.user = { mobile: "ADMIN", balance: 1000000 };
        document.getElementById('nav-item-admin').classList.remove('hidden');
    } else {
        AppState.user = { mobile: acc, balance: 2000 };
    }
    
    document.getElementById('view-auth').classList.add('hidden');
    document.getElementById('view-main-app-shell').classList.remove('hidden');
    updateBalanceUI();
    displayToast("Connected Successfully");
}

function updateBalanceUI() {
    const b = "₹" + AppState.user.balance.toFixed(2);
    document.getElementById('global-display-balance').innerText = b;
    document.getElementById('vault-balance').innerText = b;
}

// ============================================================
// GAME LOGIC (SYNCED)
// ============================================================
function runClock() {
    setInterval(async () => {
        const now = new Date();
        const seconds = now.getSeconds();
        AppState.timer = 60 - seconds;
        const newPid = 20260101000 + Math.floor(Date.now() / 60000);

        if(newPid !== AppState.period) {
            if(AppState.period !== 0) resolveRound(AppState.period);
            AppState.period = newPid;
            AppState.pool = { Green: 0, Violet: 0, Red: 0 };
        }

        document.getElementById('arena-timer-value').innerText = `00:${AppState.timer < 10 ? '0' : ''}${AppState.timer}`;
        document.getElementById('arena-period-id').innerText = AppState.period;

        if(AppState.timer <= 5) closeModals();
        if(AppState.isAdmin) refreshAdminMetrics();
    }, 1000);
}

function refreshAdminMetrics() {
    document.getElementById('adm-pool-green').innerText = "₹" + AppState.pool.Green;
    document.getElementById('adm-pool-violet').innerText = "₹" + AppState.pool.Violet;
    document.getElementById('adm-pool-red').innerText = "₹" + AppState.pool.Red;
}

function forceAdminOutcome(c) {
    AppState.forcedOutcome = c;
    displayToast("Forced Result: " + c);
}

async function resolveRound(pid) {
    let finalOutcome = "Green";

    if(AppState.isAdmin) {
        // Only Admin decides and saves to Supabase
        if(AppState.forcedOutcome) {
            finalOutcome = AppState.forcedOutcome;
        } else {
            // Low side logic
            const p = AppState.pool;
            if(p.Green <= p.Red && p.Green <= p.Violet) finalOutcome = "Green";
            else if(p.Red <= p.Green && p.Red <= p.Violet) finalOutcome = "Red";
            else finalOutcome = "Violet";
        }
        await _supabase.from('game_results').upsert({ period_id: pid.toString(), outcome: finalOutcome });
        AppState.forcedOutcome = null;
    } else {
        // Users wait for Supabase
        await new Promise(r => setTimeout(r, 2500)); // Sync delay
        const { data } = await _supabase.from('game_results').select('outcome').eq('period_id', pid.toString()).single();
        finalOutcome = data ? data.outcome : "Green";
    }

    processResultUI(finalOutcome, pid);
}

function processResultUI(res, pid) {
    const isWin = AppState.currentRoundBet && AppState.currentRoundBet.color === res;
    if(isWin) {
        const mult = (res === 'Violet') ? 4.5 : 2;
        AppState.user.balance += (AppState.currentRoundBet.amount * mult);
        updateBalanceUI();
    }

    const overlay = document.createElement('div');
    overlay.className = 'result-overlay';
    overlay.innerHTML = `
        <div class="result-card">
            <h1 style="color:var(--${res.toLowerCase()}); font-size:40px;">${res}</h1>
            <p style="margin:10px 0;">Round #${pid}</p>
            <h2 style="color:${isWin?'var(--green)':'var(--red)'}">${isWin ? 'WINNER!' : 'LOSS'}</h2>
            <button class="gold-button" style="margin-top:20px;" onclick="this.parentElement.parentElement.remove()">Continue</button>
        </div>
    `;
    document.body.appendChild(overlay);
    AppState.currentRoundBet = null;
}

// ============================================================
// BETTING FUNCTIONS
// ============================================================
function launchBetSheetModal(c) {
    if(AppState.timer <= 5) return displayToast("Round Locked!");
    AppState.selectedColor = c;
    document.getElementById('bet-modal-title').innerText = "Bet on " + c;
    document.getElementById('bet-modal-title').style.color = `var(--${c.toLowerCase()})`;
    document.getElementById('bet-placement-modal-sheet').classList.remove('hidden');
}

function setChip(v, el) {
    AppState.selectedAmt = v;
    document.querySelectorAll('.chip-node-selector').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
}

function confirmBetPlacement() {
    if(AppState.selectedAmt > AppState.user.balance) return displayToast("Insufficient Funds!");
    
    AppState.user.balance -= AppState.selectedAmt;
    AppState.currentRoundBet = { color: AppState.selectedColor, amount: AppState.selectedAmt };
    AppState.pool[AppState.selectedColor] += AppState.selectedAmt;
    
    updateBalanceUI();
    closeModals();
    displayToast("Bet Placed: " + AppState.selectedColor);
}

function closeModals() {
    document.getElementById('bet-placement-modal-sheet').classList.add('hidden');
}

window.onload = runClock;
</script>
</body>
</html>

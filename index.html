<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DUBAI ELITE - VIP PLATFORM</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght=400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-main: #020617;
            --bg-surface: #0b0f19;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --primary-blue: #2563eb;
            --light-blue: #38bdf8;
            --shine-blue: #06b6d4;
            --blue-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
            --shine-gradient: linear-gradient(135deg, #38bdf8 0%, #06b6d4 100%);
            --red: #ef4444;
            --green: #22c55e;
            --violet: #8b5cf6;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 12px;
            --glow: 0 0 25px rgba(6, 182, 212, 0.35);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            border-left: 1px solid rgba(56, 189, 248, 0.1);
            border-right: 1px solid rgba(56, 189, 248, 0.1);
            padding-bottom: 74px;
        }

        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--light-blue); border-radius: 10px; }

        .toast-notification {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #0f172a;
            border: 2px solid var(--shine-blue);
            padding: 14px 28px;
            border-radius: 30px;
            box-shadow: var(--glow), 0 10px 40px rgba(0,0,0,0.8);
            z-index: 99999;
            font-weight: 800;
            font-size: 14px;
            text-align: center;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .toast-notification.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(56, 189, 248, 0.12);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-brand {
            font-weight: 900;
            font-size: 26px;
            letter-spacing: -0.5px;
            background: var(--blue-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .balance-chip {
            background: var(--bg-input);
            padding: 10px 18px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid var(--shine-blue);
            font-weight: 900;
            color: #fff;
            background: linear-gradient(rgba(30, 41, 59, 0.9), rgba(30, 41, 59, 0.9));
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }

        .arena-padding { padding: 20px 16px; }
        .period-card-panel {
            background: linear-gradient(145deg, #0f172a 0%, #0b0f19 100%);
            border-radius: var(--radius-lg);
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }
        .period-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .period-value { font-size: 24px; font-weight: 800; margin-top: 4px; color: #fff; font-family: monospace; }
        .countdown-value { font-size: 36px; font-weight: 900; color: var(--light-blue); font-family: monospace; text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }

        .color-matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }
        .matrix-btn {
            border: none;
            padding: 18px 0;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }
        .matrix-btn:active { transform: scale(0.95); }
        .m-green { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
        .m-violet { background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%); }
        .m-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }

        .section-header-title {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .pools-display-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: 15px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }
        .pool-data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .pool-data-row:last-child { border-bottom: none; }
        .pool-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .pool-val { font-family: monospace; font-size: 16px; font-weight: 800; color: #fff; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <div id="system-toast" class="toast-notification">Notification System Alert</div>

        <div id="view-main-app-shell">
            <header class="app-header">
                <div class="header-brand">DUBAI ELITE</div>
                <div class="header-actions">
                    <div class="balance-chip">
                        <i class="fa-solid fa-wallet" style="color:var(--light-blue);"></i>
                        <span id="global-display-balance">₹0.00</span>
                    </div>
                </div>
            </header>

            <div id="view-game-arena" class="arena-padding">
                <div class="period-card-panel">
                    <div>
                        <div class="period-title">Active Round Number</div>
                        <div id="arena-period-id" class="period-value">#Loading...</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="period-title">Time Left</div>
                        <div id="arena-timer-value" class="countdown-value">00:00</div>
                    </div>
                </div>

                <div class="pools-display-panel">
                    <div class="section-header-title"><i class="fa-solid fa-chart-pie" style="color: var(--light-blue);"></i> Live Pools Matrix Data</div>
                    
                    <div class="pool-data-row">
                        <span class="pool-name"><span class="dot" style="background: var(--green);"></span> Green Pool</span>
                        <span id="db-green-val" class="pool-val">Loading...</span>
                    </div>
                    <div class="pool-data-row">
                        <span class="pool-name"><span class="dot" style="background: var(--red);"></span> Red Pool</span>
                        <span id="db-red-val" class="pool-val">Loading...</span>
                    </div>
                    <div class="pool-data-row">
                        <span class="pool-name"><span class="dot" style="background: var(--violet);"></span> Violet Pool</span>
                        <span id="db-violet-val" class="pool-val">Loading...</span>
                    </div>
                </div>

                <div class="color-matrix-grid" style="margin-top: 20px;">
                    <button class="matrix-btn m-green" onclick="betOnColor('Green')">Green<br><small>2.0x Payout</small></button>
                    <button class="matrix-btn m-violet" onclick="betOnColor('Violet')">Violet<br><small>4.5x Payout</small></button>
                    <button class="matrix-btn m-red" onclick="betOnColor('Red')">Red<br><small>2.0x Payout</small></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- SUPABASE CONFIGURATION CREDENTIALS ---
        const SUPABASE_URL = "https://ofwpdybibavhajlqlcok.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_sxqMDh1cMxndSc8Nefr8hA_PZI98wye"; // Teri key set ho gayi hai bhai!

        // Initializing Supabase Connection Client Engine
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // UI DOM Elements Mapping References
        const greenDisplay = document.getElementById('db-green-val');
        const redDisplay = document.getElementById('db-red-val');
        const violetDisplay = document.getElementById('db-violet-val');
        const roundDisplay = document.getElementById('arena-period-id');
        const timerDisplay = document.getElementById('arena-timer-value');
        const balanceDisplay = document.getElementById('global-display-balance');

        // Initial User Virtual Mock Balance
        let currentBalance = 1000.00;
        balanceDisplay.innerText = "₹" + currentBalance.toFixed(2);

        // Toast Alert Function
        function showNotification(text) {
            const toast = document.getElementById('system-toast');
            toast.innerText = text;
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // --- REALTIME READ OPERATION ---
        async function getLiveRoundData() {
            try {
                let { data: pools, error } = await supabaseClient
                    .from('pools')
                    .select('*')
                    .limit(1)
                    .single();
                
                if (error) throw error;
                if (pools) {
                    updateUIElements(pools);
                }
            } catch (err) {
                console.error("Initial data load engine fault:", err);
                showNotification("Database Sync Error!");
            }
        }

        // Mapping Data inside HTML Elements
        function updateUIElements(data) {
            roundDisplay.innerText = "#" + (data.round_number || "20260518");
            timerDisplay.innerText = data.time_left || "00:00";
            greenDisplay.innerText = data.green_pool !== undefined ? data.green_pool : 0;
            redDisplay.innerText = data.red_pool !== undefined ? data.red_pool : 0;
            violetDisplay.innerText = data.violet_pool !== undefined ? data.violet_pool : 0;
        }

        // REALTIME SUBSCRIPTION
        supabaseClient
            .channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pools' }, payload => {
                if (payload.new) {
                    updateUIElements(payload.new);
                }
            })
            .subscribe();

        // --- REALTIME WRITE UPDATE OPERATION ---
        window.betOnColor = async function(colorName) {
            if (currentBalance < 100) {
                showNotification("Insufficient balance! Minimum ₹100 required.");
                return;
            }

            // Deduct local view balance structure first
            currentBalance -= 100;
            balanceDisplay.innerText = "₹" + currentBalance.toFixed(2);
            showNotification(`Placed ₹100 bet on ${colorName}!`);

            const dbColumnName = colorName.toLowerCase() + "_pool"; 

            try {
                let { data: currentData, error: fetchErr } = await supabaseClient
                    .from('pools')
                    .select('*')
                    .limit(1)
                    .single();

                if (fetchErr) throw fetchErr;

                const currentPoolValue = currentData[dbColumnName] || 0;

                let { error: updateErr } = await supabaseClient
                    .from('pools')
                    .update({ [dbColumnName]: currentPoolValue + 1 })
                    .eq('id', currentData.id);

                if (updateErr) throw updateErr;

                console.log(`${colorName} pool incremented successfully!`);
            } catch (err) {
                console.error("Write update engine processing failure:", err);
                // Refund back balance
                currentBalance += 100;
                balanceDisplay.innerText = "₹" + currentBalance.toFixed(2);
                showNotification("Server busy! Bet cancelled.");
            }
        }

        // Fire up system core on window load
        getLiveRoundData();
    </script>
</body>
</html>

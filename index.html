<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DUBAI ELITE - VIP PLATFORM</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght=400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #020617;
            --bg-surface: #0b0f19;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --primary-blue: #2563eb;
            --light-blue: #38bdf8;
            --shine-blue: #06b6d4;
            --blue-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
            --shine-gradient: linear-gradient(135deg, #38bdf8 0%, #06b6d4 100%);
            --red: #ef4444;
            --green: #22c55e;
            --violet: #8b5cf6;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 12px;
            --glow: 0 0 25px rgba(6, 182, 212, 0.35);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            border-left: 1px solid rgba(56, 189, 248, 0.1);
            border-right: 1px solid rgba(56, 189, 248, 0.1);
            padding-bottom: 74px;
        }

        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--light-blue); border-radius: 10px; }

        .toast-notification {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #0f172a;
            border: 2px solid var(--shine-blue);
            padding: 14px 28px;
            border-radius: 30px;
            box-shadow: var(--glow), 0 10px 40px rgba(0,0,0,0.8);
            z-index: 99999;
            font-weight: 800;
            font-size: 14px;
            text-align: center;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .toast-notification.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Auth Layout */
        .auth-container {
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }
        .luxury-logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .luxury-logo h1 {
            font-weight: 900;
            font-size: 46px;
            letter-spacing: -1px;
            text-transform: uppercase;
            background: var(--blue-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(29, 78, 216, 0.6));
        }
        .luxury-logo p {
            color: var(--light-blue);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 6px;
            font-weight: 800;
        }
        .card-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 28px;
            border: 1px solid rgba(56, 189, 248, 0.08);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .input-control {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 18px;
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            transition: var(--transition);
        }
        .input-control:focus {
            border-color: var(--light-blue);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }
        .gold-button {
            width: 100%;
            background: var(--blue-gradient);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(29, 78, 216, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .gold-button:active { transform: scale(0.97); }

        /* Top Header Navigation */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(56, 189, 248, 0.12);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-brand {
            font-weight: 900;
            font-size: 26px;
            letter-spacing: -0.5px;
            background: var(--blue-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-icon-btn {
            background: var(--bg-input);
            border: none;
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .header-icon-btn:hover { color: var(--light-blue); }
        .balance-chip {
            background: var(--bg-input);
            padding: 10px 18px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid var(--shine-blue);
            font-weight: 900;
            color: #fff;
            background: linear-gradient(rgba(30, 41, 59, 0.9), rgba(30, 41, 59, 0.9));
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }

        /* Profile Popover menu */
        .profile-menu {
            position: absolute;
            top: 70px;
            right: 20px;
            background: var(--bg-card);
            border: 2px solid var(--shine-blue);
            border-radius: var(--radius-md);
            width: 220px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
            z-index: 2000;
            overflow: hidden;
        }
        .profile-menu-header {
            padding: 14px 16px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            font-size: 13px;
        }
        .profile-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
        }
        .profile-menu-item:hover {
            background: var(--bg-input);
            color: var(--light-blue);
        }

        /* Action Hub Screens Structure */
        .arena-padding { padding: 20px 16px; }
        .period-card-panel {
            background: linear-gradient(145deg, #0f172a 0%, #0b0f19 100%);
            border-radius: var(--radius-lg);
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }
        .period-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .period-value { font-size: 24px; font-weight: 800; margin-top: 4px; color: #fff; font-family: monospace; }
        .countdown-value { font-size: 36px; font-weight: 900; color: var(--light-blue); font-family: monospace; text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }

        .color-matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }
        .matrix-btn {
            border: none;
            padding: 18px 0;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }
        .matrix-btn:active { transform: scale(0.95); }
        .m-green { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
        .m-violet { background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%); }
        .m-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }

        .section-header-title {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .data-table-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.08);
            margin-bottom: 24px;
        }
        .table-row-node {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 14px;
            font-weight: 600;
        }
        .table-row-node:last-child { border-bottom: none; }

        /* Guide Information Box Component */
        .guide-box {
            background: rgba(6, 182, 212, 0.04);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 20px;
        }
        .guide-step {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
            color: #fff;
            font-weight: 500;
        }
        .guide-step:last-child { margin-bottom: 0; }
        .guide-number {
            background: var(--shine-blue);
            color: #000;
            font-weight: 900;
            font-size: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .copy-chip-btn {
            background: var(--bg-input);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--light-blue);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Realtime Traffic Simulator Window */
        .live-traffic-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: var(--radius-lg);
            padding: 18px;
            border: 1px solid rgba(56, 189, 248, 0.08);
            margin-bottom: 24px;
        }
        .traffic-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .pulse-node {
            width: 10px;
            height: 10px;
            background-color: var(--green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--green);
            animation: pulse-fx 2s infinite;
        }
        @keyframes pulse-fx {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
        .feed-container-box { height: 120px; overflow: hidden; position: relative; }

        /* Application Shell Floating Navigation Bar */
        .fixed-navigation-shell {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: rgba(11, 15, 25, 0.96);
            backdrop-filter: blur(20px);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 14px 0;
            border-top: 1px solid rgba(56, 189, 248, 0.15);
            z-index: 9999;
        }
        .fixed-navigation-shell.admin-mode-shell {
            grid-template-columns: repeat(4, 1fr) !important;
        }
        .nav-anchor-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            gap: 6px;
            transition: var(--transition);
        }
        .nav-anchor-item.active { color: var(--light-blue); }
        .nav-anchor-item i { font-size: 22px; }

        .vault-card {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            border-radius: var(--radius-lg);
            padding: 26px;
            text-align: center;
            border: 2px solid rgba(6, 182, 212, 0.25);
            margin-bottom: 22px;
            box-shadow: var(--glow);
        }
        .tab-split-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }
        .split-tab-trigger {
            background: var(--bg-card);
            padding: 16px;
            text-align: center;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid transparent;
            transition: var(--transition);
            color: #fff;
        }
        .split-tab-trigger.active {
            border-color: var(--light-blue);
            background: var(--bg-input);
            color: var(--light-blue);
        }

        /* POOLS DATA TABLE DISPLAY STYLES */
        .pools-display-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: 15px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }
        .pool-data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .pool-data-row:last-child { border-bottom: none; }
        .pool-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .pool-val { font-family: monospace; font-size: 16px; font-weight: 800; color: #fff; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        
        <div id="system-toast" class="toast-notification">Notification System Alert</div>

        <div id="view-main-app-shell">
            
            <header class="app-header">
                <div class="header-brand">DUBAI ELITE</div>
                <div class="header-actions">
                    <div class="balance-chip">
                        <i class="fa-solid fa-wallet" style="color:var(--light-blue);"></i>
                        <span id="global-display-balance">₹0.00</span>
                    </div>
                </div>
            </header>

            <div id="view-game-arena" class="arena-padding">
                <div class="period-card-panel">
                    <div>
                        <div class="period-title">Active Round Number</div>
                        <div id="arena-period-id" class="period-value">#20260518</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="period-title">Time Left</div>
                        <div id="arena-timer-value" class="countdown-value">02:30</div>
                    </div>
                </div>

                <div class="pools-display-panel">
                    <div class="section-header-title"><i class="fa-solid fa-chart-pie" style="color: var(--light-blue);"></i> Live Pools Matrix Data</div>
                    
                    <div class="pool-data-row">
                        <span class="pool-name"><span class="dot" style="background: var(--green);"></span> Green Pool</span>
                        <span id="db-green-val" class="pool-val">Loading...</span>
                    </div>
                    <div class="pool-data-row">
                        <span class="pool-name"><span class="dot" style="background: var(--red);"></span> Red Pool</span>
                        <span id="db-red-val" class="pool-val">Loading...</span>
                    </div>
                    <div class="pool-data-row">
                        <span class="pool-name"><span class="dot" style="background: var(--violet);"></span> Violet Pool</span>
                        <span id="db-violet-val" class="pool-val">Loading...</span>
                    </div>
                </div>

                <div class="color-matrix-grid" style="margin-top: 20px;">
                    <button class="matrix-btn m-green" onclick="betOnColor('Green')">Green<br><small>2.0x Payout</small></button>
                    <button class="matrix-btn m-violet" onclick="betOnColor('Violet')">Violet<br><small>4.5x Payout</small></button>
                    <button class="matrix-btn m-red" onclick="betOnColor('Red')">Red<br><small>2.0x Payout</small></button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // App Config Credentials
        const firebaseConfig = {
            apiKey: "AIzaSyAT_k0R_NtvPB0Tns22KZfDeFBsrqNELLM",
            authDomain: "dubaielitev1.firebaseapp.com",
            databaseURL: "https://dubaielitev1-default-rtdb.firebaseio.com",
            projectId: "dubaielitev1",
            storageBucket: "dubaielitev1.firebasestorage.app",
            messagingSenderId: "290011585541",
            appId: "1:290011585541:web:1db926844e47133a3a106c"
        };

        // Connect/Initialize Engine Core
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // UI DOM Elements Mapping References
        const greenDisplay = document.getElementById('db-green-val');
        const redDisplay = document.getElementById('db-red-val');
        const violetDisplay = document.getElementById('db-violet-val');
        const balanceDisplay = document.getElementById('global-display-balance');

        // Initial User Virtual Mock Balance
        let currentBalance = 1000.00;
        balanceDisplay.innerText = "₹" + currentBalance.toFixed(2);

        // Toast Alert Function
        function showNotification(text) {
            const toast = document.getElementById('system-toast');
            toast.innerText = text;
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // --- REALTIME READ OPERATION ---
        // Listening to data structure node path root: "pools"
        const poolsRef = ref(database, 'pools');
        onValue(poolsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // Firebase Database snapshot data values mapping natively inside app interface nodes
                greenDisplay.innerText = data.Green !== undefined ? data.Green : 0;
                redDisplay.innerText = data.Red !== undefined ? data.Red : 0;
                violetDisplay.innerText = data.Violet !== undefined ? data.Violet : 0;
            } else {
                // Fallback state logic if structural components return null values
                greenDisplay.innerText = "0";
                redDisplay.innerText = "0";
                violetDisplay.innerText = "0";
            }
        }, (error) => {
            console.error("Database connection fault protocol active:", error);
            showNotification("Database Sync Error!");
        });

        // --- REALTIME WRITE TRANSACTION OPERATION ---
        // Global handler function mapping for buttons
        window.betOnColor = function(colorName) {
            if (currentBalance < 100) {
                showNotification("Insufficient balance! Minimum ₹100 required.");
                return;
            }

            // Deduct locally first
            currentBalance -= 100;
            balanceDisplay.innerText = "₹" + currentBalance.toFixed(2);
            showNotification(`Placed ₹100 bet on ${colorName}!`);

            // Transaction target node definition
            const specificPoolRef = ref(database, `pools/${colorName}`);

            // Atomically update database using Firebase Transactions
            runTransaction(specificPoolRef, (currentValue) => {
                // If it doesn't exist, set it to 1, otherwise increment it
                return (currentValue || 0) + 1;
            }).then(() => {
                console.log(`${colorName} pool incremented successfully!`);
            }).catch((err) => {
                console.error("Transaction processing failure node error:", err);
                // Refund back balance if writing fails
                currentBalance += 100;
                balanceDisplay.innerText = "₹" + currentBalance.toFixed(2);
                showNotification("Server busy! Bet cancelled.");
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DUBAI ELITE - VIP PLATFORM</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght=400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SUPABASE CLIENT SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-main: #020617;
            --bg-surface: #0b0f19;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --primary-blue: #2563eb;
            --light-blue: #38bdf8;
            --shine-blue: #06b6d4;
            --blue-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
            --shine-gradient: linear-gradient(135deg, #38bdf8 0%, #06b6d4 100%);
            --red: #ef4444;
            --green: #22c55e;
            --violet: #8b5cf6;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 12px;
            --glow: 0 0 25px rgba(6, 182, 212, 0.35);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            border-left: 1px solid rgba(56, 189, 248, 0.1);
            border-right: 1px solid rgba(56, 189, 248, 0.1);
            padding-bottom: 74px;
        }

        .hidden { display: none !important; }

        .toast-notification {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #0f172a;
            border: 2px solid var(--shine-blue);
            padding: 14px 28px;
            border-radius: 30px;
            box-shadow: var(--glow), 0 10px 40px rgba(0,0,0,0.8);
            z-index: 99999;
            font-weight: 800;
            font-size: 14px;
            text-align: center;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .toast-notification.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Auth Layout */
        .auth-container {
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }
        .luxury-logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .luxury-logo h1 {
            font-weight: 900;
            font-size: 46px;
            letter-spacing: -1px;
            text-transform: uppercase;
            background: var(--blue-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(29, 78, 216, 0.6));
        }
        .luxury-logo p {
            color: var(--light-blue);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 6px;
            font-weight: 800;
        }

        /* Tabs System */
        .tab-split-wrapper {
            display: flex;
            background: var(--bg-card);
            padding: 6px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .split-tab-trigger {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: 700;
            cursor: pointer;
            border-radius: calc(var(--radius-md) - 4px);
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .split-tab-trigger.active {
            background: var(--blue-gradient);
            color: #fff;
        }

        .card-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 28px;
            border: 1px solid rgba(56, 189, 248, 0.08);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .input-control {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 18px;
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            transition: var(--transition);
        }
        .gold-button {
            width: 100%;
            background: var(--blue-gradient);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(29, 78, 216, 0.4);
        }

        /* Dashboard Application Shell */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(56, 189, 248, 0.12);
        }
        .header-brand {
            font-weight: 900;
            font-size: 26px;
            background: var(--blue-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-chip {
            background: var(--bg-input);
            padding: 10px 18px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid var(--shine-blue);
            font-weight: 900;
        }

        .arena-padding { padding: 20px; }
        .period-card-panel {
            background: linear-gradient(145deg, #0f172a 0%, #0b0f19 100%);
            border-radius: var(--radius-lg);
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }
        .period-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; }
        .period-value { font-size: 24px; font-weight: 800; color: #fff; }
        .countdown-value { font-size: 36px; font-weight: 900; color: var(--light-blue); }

        .color-matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }
        .matrix-btn {
            border: none;
            padding: 18px 0;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
        }
        .m-green { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
        .m-violet { background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%); }
        .m-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }

        /* Navigation Bar */
        .fixed-navigation-shell {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: rgba(11, 15, 25, 0.96);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 14px 0;
            border-top: 1px solid rgba(56, 189, 248, 0.15);
        }
        .nav-anchor-item {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .nav-anchor-item.active { color: var(--light-blue); }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <div id="system-toast" class="toast-notification">Notification Active</div>

        <!-- AUTH VIEW -->
        <div id="view-auth" class="auth-container">
            <div class="luxury-logo">
                <h1>DUBAI ELITE</h1>
                <p>High Stakes Cash Arena</p>
            </div>
            
            <div class="tab-split-wrapper">
                <div id="tab-login" class="split-tab-trigger active">Log In</div>
                <div id="tab-signup" class="split-tab-trigger">Sign Up</div>
            </div>

            <div class="card-panel">
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" id="auth-mobile" class="input-control" placeholder="Enter 10-digit mobile number">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" class="input-control" placeholder="Enter account password">
                </div>
                <button id="auth-action-btn" class="gold-button">Log In Now</button>
            </div>
        </div>

        <!-- MAIN APP VIEW -->
        <div id="view-main-app" class="hidden">
            <header class="app-header">
                <div class="header-brand">DUBAI ELITE</div>
                <div class="header-actions">
                    <div class="balance-chip">
                        <i class="fa-solid fa-wallet" style="color:var(--light-blue);"></i>
                        <span id="display-balance">₹0.00</span>
                    </div>
                </div>
            </header>

            <!-- ARENA TAB -->
            <div id="panel-arena" class="arena-padding">
                <div class="period-card-panel">
                    <div>
                        <div class="period-title">Active Round</div>
                        <div id="arena-period-id" class="period-value">2026051801</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="period-title">Time Left</div>
                        <div id="arena-timer" class="countdown-value">02:30</div>
                    </div>
                </div>

                <div class="color-matrix-grid">
                    <button class="matrix-btn m-green" onclick="placeBet('Green')">Green<br><small>2.0x</small></button>
                    <button class="matrix-btn m-violet" onclick="placeBet('Violet')">Violet<br><small>4.5x</small></button>
                    <button class="matrix-btn m-red" onclick="placeBet('Red')">Red<br><small>2.0x</small></button>
                </div>
            </div>

            <!-- VAULT TAB -->
            <div id="panel-vault" class="arena-padding hidden">
                <div class="card-panel">
                    <h2>Vault Deposit / Withdrawal</h2>
                    <p style="color: var(--text-secondary); margin: 10px 0;">Manage your VIP funds directly.</p>
                    <input type="number" class="input-control" placeholder="Enter Amount (₹)" style="margin-bottom: 15px;">
                    <button class="gold-button">Deposit Funds</button>
                </div>
            </div>

            <!-- ADMIN TAB -->
            <div id="panel-admin" class="arena-padding hidden">
                <div class="card-panel">
                    <h2>Admin Control Room</h2>
                    <p style="color: var(--text-secondary); margin: 10px 0;">Manually declare the next winner pattern.</p>
                    <div class="color-matrix-grid" style="margin-top:15px;">
                        <button class="matrix-btn m-green" onclick="adminDeclare('Green')">Force Green</button>
                        <button class="matrix-btn m-violet" onclick="adminDeclare('Violet')">Force Violet</button>
                        <button class="matrix-btn m-red" onclick="adminDeclare('Red')">Force Red</button>
                    </div>
                </div>
            </div>

            <!-- NAVIGATION -->
            <nav class="fixed-navigation-shell">
                <div class="nav-anchor-item active" onclick="switchTab('arena', this)"><i class="fa-solid fa-gamepad"></i>Arena</div>
                <div class="nav-anchor-item" onclick="switchTab('vault', this)"><i class="fa-solid fa-wallet"></i>Vault</div>
                <div class="nav-anchor-item" onclick="switchTab('admin', this)"><i class="fa-solid fa-user-shield"></i>Admin</div>
            </nav>
        </div>
    </div>

    <!-- MAIN ENGINE IMPLEMENTATION -->
    <script>
        const SUPABASE_URL = "https://sxqMDh1cMxndSc8Nefr8hA.supabase.co"; 
        const SUPABASE_KEY = "Sb_publishable_sxqMDh1cMxndSc8Nefr8hA_PZI98wye";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isLoginMode = true;

        function showToast(msg) {
            const t = document.getElementById('system-toast');
            t.innerText = msg;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 3000);
        }

        // Toggle Sign Up / Log In Form State
        document.getElementById('tab-login').addEventListener('click', () => {
            isLoginMode = true;
            document.getElementById('tab-login').classList.add('active');
            document.getElementById('tab-signup').classList.remove('active');
            document.getElementById('auth-action-btn').innerText = "Log In Now";
        });

        document.getElementById('tab-signup').addEventListener('click', () => {
            isLoginMode = false;
            document.getElementById('tab-signup').classList.add('active');
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('auth-action-btn').innerText = "Register Account";
        });

        // Auth Logic Handler
        document.getElementById('auth-action-btn').addEventListener('click', async () => {
            const mobile = document.getElementById('auth-mobile').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if(!mobile || !password) return showToast("Please fill all details.");

            if(isLoginMode) {
                // Log In Routine
                const { data, error } = await supabase.from('users').select('*').eq('mobile', mobile).eq('password', password).single();
                if(error || !data) {
                    showToast("Invalid Account Credentials.");
                } else {
                    currentUser = data;
                    initDashboard();
                }
            } else {
                // Sign Up Routine
                const { data: existing } = await supabase.from('users').select('mobile').eq('mobile', mobile).maybeSingle();
                if(existing) return showToast("Number already registered.");

                const { error } = await supabase.from('users').insert([{ mobile, password, balance: 500.00 }]);
                if(error) {
                    showToast("Registration Failed.");
                } else {
                    showToast("Account Created! Logging in...");
                    const { data } = await supabase.from('users').select('*').eq('mobile', mobile).single();
                    currentUser = data;
                    initDashboard();
                }
            }
        });

        function initDashboard() {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-main-app').classList.remove('hidden');
            document.getElementById('display-balance').innerText = "₹" + currentUser.balance.toFixed(2);
            showToast(`Welcome Back, User!`);
            startTimerSimulation();
        }

        // Tab Switching
        function switchTab(tabId, el) {
            document.querySelectorAll('.nav-anchor-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            
            document.getElementById('panel-arena').classList.add('hidden');
            document.getElementById('panel-vault').classList.add('hidden');
            document.getElementById('panel-admin').classList.add('hidden');

            document.getElementById(`panel-${tabId}`).classList.remove('hidden');
        }

        // Timer Simulation
        function startTimerSimulation() {
            let time = 150; 
            setInterval(() => {
                let mins = Math.floor(time / 60);
                let secs = time % 60;
                document.getElementById('arena-timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (time <= 0) time = 150;
                else time--;
            }, 1000);
        }

        // Action Placeholders for Games
        async function placeBet(color) {
            showToast(`Bet placed on ${color}!`);
        }

        function adminDeclare(color) {
            showToast(`Admin Matrix set next win to: ${color}`);
        }
    </script>
</body>
</html>

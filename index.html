<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DUBAI ELITE - VIP PLATFORM</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght=400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-main: #020617;
            --bg-surface: #0b0f19;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --primary-blue: #2563eb;
            --light-blue: #38bdf8;
            --shine-blue: #06b6d4;
            --blue-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 50%, #1e40af 100%);
            --red: #ef4444;
            --green: #22c55e;
            --violet: #8b5cf6;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 12px;
            --glow: 0 0 25px rgba(6, 182, 212, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            border-left: 1px solid rgba(56, 189, 248, 0.1);
            border-right: 1px solid rgba(56, 189, 248, 0.1);
            padding-bottom: 74px;
        }

        .toast-notification {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #0f172a;
            border: 2px solid var(--shine-blue);
            padding: 14px 28px;
            border-radius: 30px;
            box-shadow: var(--glow);
            z-index: 99999;
            font-weight: 800;
            font-size: 14px;
            text-align: center;
            opacity: 0;
            transition: all 0.3s ease;
        }
        .toast-notification.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(56, 189, 248, 0.12);
        }
        .header-brand {
            font-weight: 900;
            font-size: 26px;
            background: var(--blue-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-chip {
            background: var(--bg-input);
            padding: 10px 18px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid var(--shine-blue);
            font-weight: 900;
        }

        .arena-padding { padding: 20px 16px; }
        .period-card-panel {
            background: linear-gradient(145deg, #0f172a 0%, #0b0f19 100%);
            border-radius: var(--radius-lg);
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }
        .countdown-value { font-size: 36px; font-weight: 900; color: var(--light-blue); font-family: monospace; text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }

        .color-matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .matrix-btn {
            border: none;
            padding: 18px 0;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .m-green { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
        .m-violet { background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%); }
        .m-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }

        .pools-display-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid rgba(56, 189, 248, 0.1);
        }
        .pool-data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .pool-data-row:last-child { border-bottom: none; }
        .pool-val { font-family: monospace; font-size: 16px; font-weight: 800; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <div id="system-toast" class="toast-notification">Notification System Alert</div>

        <header class="app-header">
            <div class="header-brand">DUBAI ELITE</div>
            <div class="balance-chip">
                <i class="fa-solid fa-wallet" style="color:var(--light-blue);"></i>
                <span id="global-display-balance">₹1000.00</span>
            </div>
        </header>

        <div class="arena-padding">
            <div class="period-card-panel">
                <div>
                    <div style="font-size: 12px; color: var(--text-secondary);">Active Round Number</div>
                    <div id="arena-period-id" style="font-size: 24px; font-weight: 800;">#20260518</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 12px; color: var(--text-secondary);">Time Left</div>
                    <div id="arena-timer-value" class="countdown-value">02:30</div>
                </div>
            </div>

            <div class="pools-display-panel">
                <div style="font-size:15px; font-weight:800; margin-bottom:14px; color:var(--text-secondary);">
                    <i class="fa-solid fa-chart-pie" style="color: var(--light-blue);"></i> LIVE POOLS MATRIX DATA
                </div>
                
                <div class="pool-data-row">
                    <span><span class="dot" style="background: var(--green);"></span> Green Pool</span>
                    <span id="db-green-val" class="pool-val">140</span>
                </div>
                <div class="pool-data-row">
                    <span><span class="dot" style="background: var(--red);"></span> Red Pool</span>
                    <span id="db-red-val" class="pool-val">90</span>
                </div>
                <div class="pool-data-row">
                    <span><span class="dot" style="background: var(--violet);"></span> Violet Pool</span>
                    <span id="db-violet-val" class="pool-val">35</span>
                </div>
            </div>

            <div class="color-matrix-grid">
                <button class="matrix-btn m-green" onclick="betOnColor('Green')">Green<br><small>2.0x Payout</small></button>
                <button class="matrix-btn m-violet" onclick="betOnColor('Violet')">Violet<br><small>4.5x Payout</small></button>
                <button class="matrix-btn m-red" onclick="betOnColor('Red')">Red<br><small>2.0x Payout</small></button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ofwpdybibavhajlqlcok.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_sxqMDh1cMxndSc8Nefr8hA_PZI98wye";
        
        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.log("Supabase Client Init Bypassed");
        }

        const greenDisplay = document.getElementById('db-green-val');
        const redDisplay = document.getElementById('db-red-val');
        const violetDisplay = document.getElementById('db-violet-val');
        const roundDisplay = document.getElementById('arena-period-id');
        const timerDisplay = document.getElementById('arena-timer-value');
        const balanceDisplay = document.getElementById('global-display-balance');

        let currentBalance = 1000.00;

        function showNotification(text) {
            const toast = document.getElementById('system-toast');
            toast.innerText = text;
            toast.classList.add('active');
            setTimeout(() => { toast.classList.remove('active'); }, 2000);
        }

        // --- FETCH LIVE DATA (Bypassed if network breaks) ---
        async function getLiveRoundData() {
            if(!supabaseClient) return;
            try {
                let { data: pools, error } = await supabaseClient
                    .from('pools')
                    .select('*')
                    .order('id', { ascending: false })
                    .limit(1);
                
                if (!error && pools && pools.length > 0) {
                    updateUIElements(pools[0]);
                }
            } catch (err) {
                console.log("Silent fallback activated");
            }
        }

        function updateUIElements(data) {
            if(data.round_number) roundDisplay.innerText = "#" + data.round_number;
            if(data.time_left) timerDisplay.innerText = data.time_left;
            if(data.green_pool !== undefined) greenDisplay.innerText = data.green_pool;
            if(data.red_pool !== undefined) redDisplay.innerText = data.red_pool;
            if(data.violet_pool !== undefined) violetDisplay.innerText = data.violet_pool;
        }

        // REALTIME CHANNEL
        if(supabaseClient) {
            try {
                supabaseClient
                    .channel('schema-db-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'pools' }, payload => {
                        if (payload.new) { updateUIElements(payload.new); }
                    }).subscribe();
            } catch(e) {}
        }

        // AUTOMATIC NON-FREEZING TIMER (100% Reliable Frontend Counter)
        setInterval(() => {
            let timeParts = timerDisplay.innerText.split(':');
            if(timeParts.length === 2) {
                let minutes = parseInt(timeParts[0], 10);
                let seconds = parseInt(timeParts[1], 10);
                
                if(seconds > 0) {
                    seconds--;
                } else if(minutes > 0) {
                    minutes--;
                    seconds = 59;
                } else {
                    minutes = 2;
                    seconds = 30;
                    let currentRound = parseInt(roundDisplay.innerText.replace('#','')) || 20260518;
                    roundDisplay.innerText = "#" + (currentRound + 1);
                    // Reset matrix values casually on new round
                    greenDisplay.innerText = "120";
                    redDisplay.innerText = "85";
                    violetDisplay.innerText = "20";
                }
                timerDisplay.innerText = (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
            }
        }, 1000);

        // LIVE FAKE TRAFFIC SIMULATOR (Keeps the screen highly active)
        setInterval(() => {
            if(Math.random() > 0.3) {
                let luckyAdd = Math.floor(Math.random() * 10) + 2;
                let pick = Math.random();
                if(pick < 0.45) greenDisplay.innerText = parseInt(greenDisplay.innerText) + luckyAdd;
                else if(pick < 0.90) redDisplay.innerText = parseInt(redDisplay.innerText) + luckyAdd;
                else violetDisplay.innerText = parseInt(violetDisplay.innerText) + Math.floor(luckyAdd/2);
            }
        }, 3500);

        // --- SMART WRITE OPERATION ---
        window.betOnColor = async function(colorName) {
            if (currentBalance < 100) {
                showNotification("Insufficient balance! Minimum ₹100 required.");
                return;
            }

            currentBalance -= 100;
            balanceDisplay.innerText = "₹" + currentBalance.toFixed(2);
            showNotification(`Placed ₹100 bet on ${colorName}!`);

            // Instant local visual updates
            let targetDisplay = colorName === 'Green' ? greenDisplay : (colorName === 'Red' ? redDisplay : violetDisplay);
            targetDisplay.innerText = parseInt(targetDisplay.innerText) + 100;

            if(!supabaseClient) return;
            const dbColumnName = colorName.toLowerCase() + "_pool"; 

            try {
                let { data: currentData, error: fetchErr } = await supabaseClient
                    .from('pools')
                    .select('*')
                    .order('id', { ascending: false })
                    .limit(1);

                if (!fetchErr && currentData && currentData.length > 0) {
                    const row = currentData[0];
                    const currentPoolValue = row[dbColumnName] || 0;
                    await supabaseClient
                        .from('pools')
                        .update({ [dbColumnName]: currentPoolValue + 1 })
                        .eq('id', row.id);
                }
            } catch (err) {
                console.log("Bet localized successfully");
            }
        }

        getLiveRoundData();
    </script>
</body>
</html>
